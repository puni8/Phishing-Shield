<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Security Warning</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Loader -->
<div id="loader">
    <div class="spinner"></div>
    <p>Scanning website for threats...</p>
</div>

<!-- Main UI -->
<div class="container" id="mainContent" style="display:none;">

    <div class="icon" id="riskIcon">⚠️</div>
    <h1 id="riskTitle">Security Warning</h1>

    <div class="badge" id="riskBadge">RISK</div>

    <!-- Domain Info -->
    <div class="domain-box">
        <p><strong>Domain:</strong> <span id="domainName"></span></p>
        <p><strong>Connection:</strong> <span id="connectionType"></span></p>
    </div>

    <!-- Explanation -->
    <div class="explanation" id="explanation"></div>

    <!-- Feature Importance -->
    <div class="features">
        <h3>Why this is phishing</h3>
        <div id="featureList"></div>
    </div>

    <!-- Buttons -->
    <div class="buttons">
        <button class="safe" id="backBtn">🔙 Go Back</button>
        <button class="danger" id="proceedBtn">Continue Anyway</button>
    </div>

</div>

<script src="warning.js"></script>

</body>
</html>
